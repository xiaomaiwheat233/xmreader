spring:
  application:
    name: xmreader-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/xmreader?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:xmreader}
    password: ${DB_PASSWORD:xmreader_dev}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 5000
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

info:
  app:
    name: 小麦中文网 Backend
    version: 0.1.0

app:
  crawler:
    enabled: ${CRAWLER_ENABLED:true}
    base-url: ${CRAWLER_BASE_URL:http://localhost:7765}
    light-novel-enabled: ${LIGHT_NOVEL_ENABLED:true}
    search-limit: ${CRAWLER_SEARCH_LIMIT:20}
    connect-timeout-seconds: ${CRAWLER_CONNECT_TIMEOUT_SECONDS:5}
    read-timeout-seconds: ${CRAWLER_READ_TIMEOUT_SECONDS:3600}
  fixtures:
    enabled: ${FIXTURES_ENABLED:false}
  security:
    issuer: xmreader
    audience: xmreader-web
    jwt-secret-base64: ${JWT_SECRET_BASE64:eG1yZWFkZXItbG9jYWwtZGV2ZWxvcG1lbnQtc2VjcmV0LWtleS1jaGFuZ2UtbWU=}
    access-token-ttl: 15m
    refresh-token-ttl: 7d
    refresh-cookie-name: xmreader_refresh
    refresh-cookie-secure: ${REFRESH_COOKIE_SECURE:false}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

logging:
  level:
    root: INFO
    org.springframework: INFO
