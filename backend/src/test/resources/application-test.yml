spring:
  datasource:
    url: jdbc:h2:mem:xmreader;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
    locations: classpath:db/testmigration

management:
  endpoint:
    health:
      show-details: always

app:
  fixtures:
    enabled: true
  crawler:
    enabled: false
    base-url: http://localhost:7765
    search-limit: 20
    import-chapter-limit: 5
    connect-timeout-seconds: 1
    read-timeout-seconds: 1
