name: xmreader-local

services:
  mysql:
    image: mysql:8.0.46
    container_name: xmreader-mysql
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-xmreader}
      MYSQL_USER: ${MYSQL_USER:-xmreader}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-xmreader_dev}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-xmreader_root_dev}
      TZ: UTC
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - xmreader_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  sonovel-adapter:
    build:
      context: ./crawler/sonovel-adapter
      args:
        SONOVEL_COMMIT: 76150dbd2827b4de97cde83cffb3ee367bc9be3a
    container_name: xmreader-sonovel-adapter
    environment:
      JAVA_OPTS: "-Dmode=web -Dconfig.file=/sonovel/config.ini"
    ports:
      - "127.0.0.1:7765:7765"
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/127.0.0.1/7765'"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    restart: unless-stopped

volumes:
  xmreader_mysql_data:
